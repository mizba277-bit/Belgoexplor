<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    
    <meta name="google-site-verification" content="6DcE71ikjqGykikNfnwTfwKi5ynl2vvgNhJDP5pm9_U" />

    <title>FUEZO — Premium Dessert Lounge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --maroon: #751E24; 
        --maroon-dark: #4a1116;
        --off-white: #fcf8f8;
        --off-white-card: #f9f3f3;
        --dark-text: #290f11;
        font-family: 'Poppins', sans-serif;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      
      body {
        min-height: 100vh;
        /* Full Maroon Background */
        background: radial-gradient(circle at top right, #8a242b, var(--maroon-dark));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 16px;
        color: var(--dark-text);
      }

      .card {
        width: 100%;
        max-width: 380px;
        background: var(--off-white-card);
        border-radius: 32px;
        padding: 30px 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.2);
        text-align: center;
      }

      .logo { 
        width: 180px; 
        margin-bottom: 12px;
      }
      
      .title { 
        font-size: 15px; font-weight: 800; color: var(--dark-text); 
        letter-spacing: 2px; margin-bottom: 24px; opacity: 0.9;
      }

      .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 20px; }

      .btn {
        background: #ffffff; border-radius: 20px; padding: 18px 12px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 8px; color: var(--dark-text); text-decoration: none; font-weight: 700; font-size: 12px;
        border: 1px solid #eaeaea; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        transition: all 0.2s ease; cursor: pointer;
      }

      .btn:active { transform: scale(0.96); background: #f7f7f7; }

      /* Off-White Icon Background & Maroon Icon Strokes */
      .ico {
        width: 46px; height: 46px; 
        background: var(--off-white);
        border: 1px solid #ede8e8;
        border-radius: 15px; display: flex; align-items: center; justify-content: center;
      }

      .ico svg { 
        width: 26px; height: 26px; 
        stroke: var(--maroon); 
        fill: none; stroke-width: 2; 
      }

      .foot { font-size: 11px; color: #888; margin-top: 20px; letter-spacing: 1px; font-weight: 600; }
    </style>
</head>
<body>

<main class="card">
  <img src="YOUR_NEW_LOGO.png" class="logo" alt="Fuezo">
  <div class="title">Taste The Happiness</div>

  <div class="grid">
    <!-- Menu -->
    <a href="https://fuezomenu.pages.dev" target="_blank" class="btn">
      <div class="ico">
        <svg viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path><path d="M7 2v20"></path><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path></svg>
      </div>
      Menu
    </a>

    <!-- Call -->
    <a href="tel:+919567384858" class="btn">
      <div class="ico">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
      </div>
      Call
    </a>

    <!-- WhatsApp -->
    <a href="https://wa.me/919567384858" target="_blank" class="btn">
      <div class="ico">
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
      </div>
      WhatsApp
    </a>

    <!-- Instagram -->
    <a href="https://www.instagram.com/fuezo.in" target="_blank" class="btn">
      <div class="ico">
        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
      </div>
      Instagram
    </a>

    <!-- Google Review -->
    <a href="https://search.google.com/local/writereview?placeid=ChIJi5RKTABnUjoR_oQyIhU_irY" target="_blank" class="btn">
      <div class="ico">
        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
      </div>
      Google Review
    </a>

    <!-- Gift Card -->
    <a href="https://fuezogift.pages.dev" target="_blank" class="btn">
      <div class="ico">
        <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"></rect><path d="M12 8v12"></path><path d="M19 12H5"></path><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"></path></svg>
      </div>
      Gift Card
    </a>
  </div>
  
  <div class="foot">© 2025 FUEZO</div>
</main>

</body>
</html>
